
spring:
  application:
    name: UberProject-BookingService
  datasource:
    url:jdbc: mysql://localhost:3306/EntityService
    username: root
    password: ${mysql_password}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
server:
  port: 8081

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    preferIpAddress: true